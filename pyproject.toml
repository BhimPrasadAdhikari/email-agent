[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "email-agent"
version = "0.1.0"
description = "Ambient email assistant with triage, human-in-the-loop, and memory"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Your Name", email = "you@example.com" }]
dependencies = [
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "openai>=1.40.0",        # Cerebras exposes OpenAI-compatible API
    "python-dotenv>=1.0.0",
    "typer>=0.12.0",         # for CLI
    "rich>=13.7.0"           # nicer CLI output
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "langsmith>=0.1.100",
    "ruff>=0.5.0",
    "mypy>=1.10.0"
]

[tool.hatch.build.targets.wheel]
packages = ["src/email_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"